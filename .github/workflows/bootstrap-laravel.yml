name: Bootstrap Laravel project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: bootstrap generated Laravel') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Laravel framework skeleton
        run: |
          rm -rf /tmp/laravel
          git clone --depth 1 https://github.com/laravel/laravel.git /tmp/laravel
          rsync -a --ignore-existing /tmp/laravel/ ./

      - name: Verify Laravel
        run: |
          test -f artisan
          test -d app
          test -d bootstrap
          test -d config
          test -d database
          test -d public
          test -d resources
          test -d routes
          echo "Laravel framework files are present."

      - name: Commit generated framework
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bootstrap generated Laravel" || exit 0
          git push
