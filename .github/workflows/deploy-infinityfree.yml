name: Deploy Laravel to InfinityFree

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, pdo, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup production environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          php artisan key:generate --force
          php artisan route:list --except-vendor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        run: |
          npm install
          npm run build

      - name: Prepare InfinityFree package
        run: |
          rm -rf deploy
          mkdir deploy
          cp -a app bootstrap config database resources routes vendor artisan composer.json composer.lock .env deploy/
          touch deploy/database/database.sqlite
          mkdir -p deploy/storage/app/private deploy/storage/framework/cache deploy/storage/framework/sessions deploy/storage/framework/views deploy/storage/logs
          touch deploy/storage/app/.gitignore deploy/storage/app/private/.gitignore deploy/storage/framework/.gitignore deploy/storage/framework/cache/.gitignore deploy/storage/framework/sessions/.gitignore deploy/storage/framework/views/.gitignore deploy/storage/logs/.gitignore
          cp -a public deploy/public

          cat > deploy/.htaccess <<'EOF'
          RewriteEngine On
          RewriteRule ^storage/(.*)$ /storage/app/public/$1 [END]
          RewriteRule (.*) /public/$1 [L]
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftp.infinityfree.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/
          server-dir: /htdocs/
          dangerous-clean-slate: false
          log-level: standard
