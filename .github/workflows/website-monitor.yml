name: MRK Website Auto Monitor

on:
  workflow_run:
    workflows: ["Deploy Laravel to InfinityFree"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mrk-website-monitor
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check static server response
        shell: bash
        run: |
          set -euo pipefail
          curl -L --max-time 20 -fsS "https://meeladrazakhokhar786.freehosting.dev/server-check.html" | grep -q "MRK_SERVER_STATIC_OK"
          echo "STATIC_SERVER_OK=true"

      - name: Check PHP and Laravel bootstrap
        shell: bash
        run: |
          set +e
          curl -L --max-time 30 -sS -o diagnostic.txt -w "HTTP_STATUS=%{http_code}\nTIME=%{time_total}\n" "https://meeladrazakhokhar786.freehosting.dev/diagnostic.php" | tee diagnostic.status
          cat diagnostic.txt 2>/dev/null || true
          status=$(grep 'HTTP_STATUS=' diagnostic.status | cut -d= -f2)
          if [ "$status" != "200" ] || ! grep -q "DIAGNOSTIC=OK" diagnostic.txt 2>/dev/null; then
            echo "Laravel/PHP diagnostic failed."
            exit 1
          fi

      - name: Check key routes
        shell: bash
        run: |
          set -euo pipefail
          for path in "/" "/about" "/services" "/contact"; do
            code=$(curl -L --max-time 20 -sS -o /dev/null -w "%{http_code}" "https://meeladrazakhokhar786.freehosting.dev$path")
            echo "$path => $code"
            if [ "$code" != "200" ]; then
              exit 1
            fi
          done

      - name: Create failure report
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "AUTO-MONITOR: MRK Laravel site health check failed";
            const body = [
              "Automated monitoring detected a production-server failure.",
              "",
              "The check now distinguishes static web-server availability from PHP/Laravel availability.",
              "A failure of the static probe points to hosting/web-server availability.",
              "A successful static probe with a failed diagnostic points to PHP/runtime/Laravel configuration.",
              "",
              "Live site: https://meeladrazakhokhar786.freehosting.dev/?i=1",
              "Static probe: https://meeladrazakhokhar786.freehosting.dev/server-check.html",
              "Diagnostic: https://meeladrazakhokhar786.freehosting.dev/diagnostic.php"
            ].join("\n");

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.data.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Repeated health-check failure at ${new Date().toISOString()}.`
              });
            }
